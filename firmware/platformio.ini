[env:esp32]
; Pinned: Arduino core 2.x. me-no-dev/ESPAsyncWebServer 1.2.4 asserts at boot on core 3.x
; (tcp_alloc 'Required to lock TCPIP core functionality') - seen 2026-10-14 after an OTA built unpinned.
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    me-no-dev/ESPAsyncWebServer@^1.2.4
    bblanchon/ArduinoJson@^7.0.0

[env:ota]
extends = env:esp32
upload_protocol = espota
upload_port = printer.local

; Home unit: EM5822H on an ESP32-S3 super mini (2026-10). Pins and hostname via build flags,
; config.h keeps the esp32dev defaults. Serial over the S3's USB-C needs CDC_ON_BOOT.
[env:s3home]
platform = espressif32
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPRINTER_TX_PIN=5
    -DPRINTER_RX_PIN=4
    -DMDNS_HOSTNAME=\"printer-home\"
lib_deps = ${env:esp32.lib_deps}

[env:s3home-ota]
extends = env:s3home
upload_protocol = espota
upload_port = printer-home.local
